<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="description" content="Patchbay — a playable modular synthesizer in your browser." />
    <title>Patchbay</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <main id="stage">
        <section id="canvas-root" aria-label="Patch canvas"></section>
        <aside id="dock" aria-label="Play and inspect"></aside>
      </main>
      <footer id="playbar" aria-label="Keyboard"></footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
