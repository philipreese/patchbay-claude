# Manual-only GitHub Pages deploy of a chosen revision. Added after the build
# deadline by the judge; it does not change the application.
name: Deploy to Pages
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to deploy
        required: true
        default: claude/patchbay-synthesizer-rlivk0
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
